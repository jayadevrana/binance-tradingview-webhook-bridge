# Reverse proxy for the bridge, terminating TLS.
# Put your real domain in server_name, then run certbot to issue a cert:
#     sudo certbot --nginx -d bridge.yourdomain.com
#
# TradingView requires HTTPS on port 443 (or 80) — it will NOT call arbitrary
# high ports. This proxy is what makes the bridge reachable at a clean URL.

server {
    listen 80;
    server_name bridge.yourdomain.com;

    # Let certbot handle the ACME challenge, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bridge.yourdomain.com;

    # ssl_certificate / ssl_certificate_key are filled in by certbot.

    # Only the webhook + health endpoints need to be public.
    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
